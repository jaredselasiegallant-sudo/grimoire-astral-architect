name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (pin to win-x64 to prevent win10-* RID injection)
        run: dotnet restore src/Grimoire.App/Grimoire.App.csproj -p:RuntimeIdentifiers=win-x64

      - name: Publish win-x64
        run: >
          dotnet publish src/Grimoire.App/Grimoire.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Zip output
        run: Compress-Archive -Path ./publish/* -DestinationPath Grimoire-Astral-Architect-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Grimoire-Astral-Architect-win-x64.zip
          generate_release_notes: true
