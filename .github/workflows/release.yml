name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Grimoire.AstralArchitect.sln

      - name: Publish win-x64
        run: >
          msbuild src/Grimoire.App/Grimoire.App.csproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:RuntimeIdentifier=win-x64
          /p:SelfContained=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:WindowsAppSDKSelfContained=true
          /t:Publish
          /p:OutputPath=./publish

      - name: Zip output
        run: Compress-Archive -Path ./publish/* -DestinationPath Grimoire-Astral-Architect-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Grimoire-Astral-Architect-win-x64.zip
          generate_release_notes: true
